version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: sm3d_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sm3d}
      POSTGRES_USER: ${POSTGRES_USER:-sm3d_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sm3d_user} -d ${POSTGRES_DB:-sm3d}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sm3d_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: