version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: sm3d_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sm3d}
      POSTGRES_USER: ${POSTGRES_USER:-sm3d_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sm3d_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sm3d_user} -d $${POSTGRES_DB:-sm3d}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sm3d_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: sm3d_backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - /app/__pycache__
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sm3d_user}:${POSTGRES_PASSWORD:-sm3d_password}@postgres:5432/${POSTGRES_DB:-sm3d}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/4
      - DEBUG=true
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: sm3d_celery
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sm3d_user}:${POSTGRES_PASSWORD:-sm3d_password}@postgres:5432/${POSTGRES_DB:-sm3d}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: sm3d_frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data: